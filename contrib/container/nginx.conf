# Basics
user frepple;
worker_processes auto;
pid /run/nginx.pid;
access_log /dev/stdout;
error_log /dev/stderr;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    sendfile on;
    keepalive_timeout 65;
    tcp_nopush on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    http2 on;

    charset utf-8;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
                application/xml text/xml image/svg+xml;

    # Uvicorn process
    upstream frepple_asgi {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        # Paths to the web service for the scenarios
        location ~ ^/ws/(?:default|scenario(?:[1-9]|[1-3][0-9]))/ {
            proxy_pass http://127.0.0.1:$frepple_scenario_port$request_uri;
        }
        location ~ ^/svc/(?:default|scenario(?:[1-9]|[1-3][0-9]))/(.*)$ {
            proxy_pass http://127.0.0.1:$frepple_scenario_port/$1$is_args$args;
        }

        # Avoid recompressing already-compressed log downloads.
        location ^~ /execute/logdownload/ {
            gzip off;
            proxy_pass http://frepple_asgi;
        }

        # Static files
        location = /robots.txt {
            alias /usr/share/frepple/static/robots.txt;
            expires off;
        }
        location = /favicon.ico {
            alias /usr/share/frepple/static/favicon.ico;
            expires off;
        }
        location /static/ {
            alias /usr/share/frepple/static/;
            autoindex off;
            expires 3h;
        }
        location /var/log/frepple/ {
            internal;
            alias /var/log/frepple/;
        }
        # TODO apache had this folder as xsendfile. Is that really needed?
        # location /usr/share/frepple/venv/ {
        #     internal;
        #     alias /usr/share/frepple/venv/;
        # }

        # All other requests go to Uvicorn
        location / {
            proxy_pass http://frepple_asgi;
        }
    }

    # Web socket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $uri $frepple_scenario_port {
        default "";
        ~^/(?:ws|svc)/default/ 8002;
        ~^/(?:ws|svc)/scenario1/ 8003;
        ~^/(?:ws|svc)/scenario2/ 8004;
        ~^/(?:ws|svc)/scenario3/ 8005;
        ~^/(?:ws|svc)/scenario4/ 8006;
        ~^/(?:ws|svc)/scenario5/ 8007;
        ~^/(?:ws|svc)/scenario6/ 8008;
        ~^/(?:ws|svc)/scenario7/ 8009;
        ~^/(?:ws|svc)/scenario8/ 8010;
        ~^/(?:ws|svc)/scenario9/ 8011;
        ~^/(?:ws|svc)/scenario10/ 8012;
        ~^/(?:ws|svc)/scenario11/ 8013;
        ~^/(?:ws|svc)/scenario12/ 8014;
        ~^/(?:ws|svc)/scenario13/ 8015;
        ~^/(?:ws|svc)/scenario14/ 8016;
        ~^/(?:ws|svc)/scenario15/ 8017;
        ~^/(?:ws|svc)/scenario16/ 8018;
        ~^/(?:ws|svc)/scenario17/ 8019;
        ~^/(?:ws|svc)/scenario18/ 8020;
        ~^/(?:ws|svc)/scenario19/ 8021;
        ~^/(?:ws|svc)/scenario20/ 8022;
        ~^/(?:ws|svc)/scenario21/ 8023;
        ~^/(?:ws|svc)/scenario22/ 8024;
        ~^/(?:ws|svc)/scenario23/ 8025;
        ~^/(?:ws|svc)/scenario24/ 8026;
        ~^/(?:ws|svc)/scenario25/ 8027;
        ~^/(?:ws|svc)/scenario26/ 8028;
        ~^/(?:ws|svc)/scenario27/ 8029;
        ~^/(?:ws|svc)/scenario28/ 8030;
        ~^/(?:ws|svc)/scenario29/ 8031;
        ~^/(?:ws|svc)/scenario30/ 8032;
        ~^/(?:ws|svc)/scenario31/ 8033;
        ~^/(?:ws|svc)/scenario32/ 8034;
        ~^/(?:ws|svc)/scenario33/ 8035;
        ~^/(?:ws|svc)/scenario34/ 8036;
        ~^/(?:ws|svc)/scenario35/ 8037;
        ~^/(?:ws|svc)/scenario36/ 8038;
        ~^/(?:ws|svc)/scenario37/ 8039;
        ~^/(?:ws|svc)/scenario38/ 8040;
        ~^/(?:ws|svc)/scenario39/ 8041;
    }
}
